name: qlsv

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run python3 scripts/init_env.py first}
      MYSQL_USER: ${MYSQL_USER:?Missing MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Missing DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Missing MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Missing MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    logging: *logging

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 16M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "php", "-d", "allow_url_fopen=1", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  mysql_data:
  static_data:

networks:
  edge:
  data:
    internal: true
