# Always combine with compose.yaml, or use bash scripts/monitoring.sh.
x-monitoring-logging: &monitoring-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    volumes:
      - ./monitoring/nginx/status.conf:/etc/nginx/conf.d/status.conf:ro

  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *monitoring-logging

  grafana:
    image: grafana/grafana:12.4.12
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Run python3 scripts/init_monitoring.py}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python3 scripts/init_monitoring.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qlsv-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *monitoring-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: unless-stopped
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network,diskIO
    networks: [monitoring]
    mem_limit: 192m
    logging: *monitoring-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8082/stub_status
    networks: [edge, monitoring]
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    mem_limit: 48m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *monitoring-logging

  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Run python3 scripts/init_monitoring.py}
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=qlsv_exporter
      - --collect.global_status
      - --collect.global_variables
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time
    networks: [data, monitoring]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    mem_limit: 48m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *monitoring-logging

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
