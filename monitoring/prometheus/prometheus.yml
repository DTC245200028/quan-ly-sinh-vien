global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Keep only this assignment's containers, not the old WordPress lab.
      - source_labels: [container_label_com_docker_compose_project]
        regex: qlsv
        action: keep

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]
